; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	https://github.com/pschatzmann/ESP32-A2DP#v1.8.4
	adafruit/Adafruit SSD1306@^2.5.7
monitor_speed = 115200
build_flags = 
	-D SSD1306_NO_SPLASH=
	-D VERSION=0.3.0

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=4

[env:test]
build_type = test
build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=2

[env:release]
build_type = release
build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=2

[env:release-logged]
build_type = release
build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=3 ;include log macros up to level info
	-D LOG_DEFAULT_LEVEL=2
	-D OSP_LOG_LEVEL=3 ;project code is set to log level info
	